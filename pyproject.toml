[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chebtorch"
version = "0.1.0.dev0"
description = "chebax's special functions and distributions for PyTorch, inference only"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andres Hernandez", email = "andres.hernandez.deml@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.urls]
Repository = "https://github.com/andreshernandez-spec/chebtorch"

[project.optional-dependencies]
# tools/export.py needs more than an extra can give: a chebax git checkout
# installed editable (its provenance comes from git) and mpmath
test = ["pytest", "numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
