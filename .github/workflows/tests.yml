name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch: "torch==2.4.*"   # the tested floor (pyproject's torch>=)
          - python-version: "3.13"
            torch: "torch"          # latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # CPU wheels: the runners have no GPU. torch 2.4's inductor imports
        # setuptools at run time without declaring it (the compile test)
        run: |
          python -m pip install setuptools
          python -m pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Run suite
        run: python -m pytest -q
